<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci - EHIMBANE</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #E2F0D9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .thank-you-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .brand-subtitle {
            font-size: 12px;
            font-weight: 700;
            color: #2E7D32; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .icon-success {
            font-size: 60px;
            color: #25D366; 
            margin-bottom: 20px;
            animation: popIn 0.5s ease-out;
        }

        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #666666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-retour {
            display: inline-block;
            background-color: #25D366; 
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn-retour:hover {
            background-color: #1ebd57;
            transform: translateY(-2px);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <div class="brand-title">EHIMBANE</div>
        <div class="brand-subtitle">Initiatives & Développement</div>
        
        <div class="icon-success">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <h1>Message envoyé !</h1>
        <p>Merci pour votre message. L'équipe d'<strong>EHIMBANE</strong> a bien reçu votre demande et reviendra vers vous par e-mail dans les plus brefs délais.</p>
        
        <a href="contact.html" class="btn-retour">Retour au site</a>
    </div>

</body>
</html>
